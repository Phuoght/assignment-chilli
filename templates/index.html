<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chilli Chat Bot</title>
    <meta name="description" content="Chilli Chat Bot. Let ask questions about company policies, HR, and processes.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/Outlook-Chilli.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container">

        <!-- ── Sidebar ── -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <img src="{{ url_for('static', filename='images/Outlook-Chilli.png') }}" alt="Chilli Logo" class="logo-img">
                    <span class="logo-text">Chilli</span>
                </div>
                <div class="header-actions">
                    <button class="new-chat-btn" id="newChatBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                        <span id="newChatLabel">New Chat</span>
                    </button>
                </div>
            </div>

            <!-- Search Modes -->
            <div class="sidebar-section">
                <label class="sidebar-label" id="searchModeLabel">Search Mode</label>
                <div class="mode-selector">
                    <button class="mode-item active" data-mode="all">
                        <span class="mode-icon">🌐</span>
                        <span class="mode-name" id="modeGlobalLabel">Global Search</span>
                    </button>
                    <button class="mode-item" data-mode="internal">
                        <span class="mode-icon">📄</span>
                        <span class="mode-name" id="modeInternalLabel">Internal Policies</span>
                    </button>
                    <button class="mode-item" data-mode="legal">
                        <span class="mode-icon">⚖️</span>
                        <span class="mode-name" id="modeLegalLabel">Legal & Compliance</span>
                    </button>
                </div>
            </div>

            <!-- Chat History -->
            <div class="sidebar-section history-section">
                <label class="sidebar-label" id="historyLabel">Recent Conversations</label>
                <div class="chat-history" id="chatHistory">
                    <div class="history-empty" id="historyEmptyLabel">No conversations yet</div>
                </div>
            </div>

            <div class="sidebar-footer">
                <div class="footer-info">
                    <span>Chilli Chat Bot v1.0</span>
                </div>
            </div>
        </aside>

        <!-- ── Main ── -->
        <div class="main-wrap">

            <!-- Main Content -->
            <div class="main-content">
                <header class="top-header">
                    <div class="header-left">
                        <button class="sidebar-toggle" id="sidebarToggle">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
                            </svg>
                        </button>
                    </div>
                    <div class="header-right">
                        <button class="lang-toggle" id="langToggle" title="Switch Language">
                            <span class="vn-text">VN</span>
                            <span class="en-text">EN</span>
                        </button>
                    </div>
                </header>

            <!-- Chat content -->
            <main class="chat-content" id="chatContent">

                <!-- Welcome -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-logo">
                        <img src="{{ url_for('static', filename='images/Outlook-Chilli.png') }}" alt="Chilli Logo">
                    </div>
                    <h1 class="welcome-title" id="welcomeTitle">Chilli Knowledge Base</h1>
                    <p class="welcome-sub" id="welcomeSub">Hỏi bất cứ điều gì về các văn bản quy phạm pháp luật và chính sách nội bộ.<br>Tôi sẽ tìm kiếm trong các tài liệu hợp nhất để đưa ra câu trả lời chính xác.</p>

                    <div class="welcome-cards" id="welcomeCards">
                        <!-- Populated by JS based on mode -->
                    </div>
                </div>

                <!-- Messages -->
                <div class="messages-container" id="messagesContainer"></div>

                <!-- Typing indicator -->
                <div class="typing-indicator" id="typingIndicator" style="display:none;">
                    <div class="typing-avatar">
                        <img src="{{ url_for('static', filename='images/Outlook-Chilli.png') }}" alt="Chilli">
                    </div>
                    <div class="typing-dots">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            </main>

            <!-- Input -->
            <footer class="input-area">
                <form class="input-form" id="inputForm">
                    <div class="input-wrapper" id="inputWrapper">
                        <textarea class="input-field" id="inputField"
                            placeholder="Ask about company policies, HR, process and legal ..."
                            rows="1" autocomplete="off"></textarea>
                        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                            </svg>
                        </button>
                    </div>
                    <p class="input-hint">Chilli Chat Bot</p>
                </form>
            </footer>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
